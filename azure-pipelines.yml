trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: Use Node.js 22

  - script: npm ci
    workingDirectory: extension
    displayName: Install dependencies

  - script: npm run lint
    workingDirectory: extension
    displayName: Lint

  - script: npm run test
    workingDirectory: extension
    displayName: Unit tests

  - script: npm run package
    workingDirectory: extension
    displayName: Build and package VSIX

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: extension/adaptive-feature-prioritization.vsix
      ArtifactName: adaptive-feature-prioritization-vsix
      publishLocation: Container
